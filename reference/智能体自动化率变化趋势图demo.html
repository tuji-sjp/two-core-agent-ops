<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智能体自动化率每日趋势曲线图</title>
    <!-- 引入 Tailwind CSS 进行页面样式重置和快速布局 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 引入 ECharts 数据可视化库 -->
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
    <style>
        /* 确保页面无横向滚动条 */
        body { overflow-x: hidden; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen p-4 md:p-8 flex items-center justify-center font-sans">
    
    <div class="w-full max-w-6xl bg-white p-6 md:p-8 rounded-2xl shadow-xl border border-slate-100">
        <!-- 头部信息 -->
        <div class="mb-8 flex flex-col md:flex-row justify-between items-start md:items-end gap-4">
            <div>
                <p class="text-sm text-slate-500">
                    <span class="inline-block w-3 h-3 bg-sky-400 opacity-50 rounded-sm mr-1 align-middle"></span>
                    背景阶梯覆盖面积代表各智能体<strong class="text-slate-700">年度目标值</strong>，彩色折线代表<strong class="text-slate-700">每日实际达成趋势</strong>。
                </p>
            </div>
            <div class="flex items-center justify-end gap-3">
                <span class="hidden sm:inline-flex items-center px-3 py-1 rounded-full text-xs font-medium bg-emerald-50 text-emerald-600 border border-emerald-200">
                    实时监控运行中
                </span>
                <!-- 优化后的动态时间周期筛选框与日期显示 -->
                <div class="flex items-center gap-2">
                    <!-- 自定义下拉框 -->
                    <div class="relative" id="customDropdown">
                        <button id="dropdownTrigger" class="bg-white border border-slate-200 text-slate-700 py-1.5 px-3 rounded-sm text-sm focus:outline-none flex items-center justify-between w-[76px] hover:border-emerald-400 transition-colors shadow-sm">
                            <span id="dropdownLabel">按天</span>
                            <svg class="h-4 w-4 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
                        </button>
                        <div id="dropdownMenu" class="hidden absolute top-full left-0 mt-1 w-[76px] bg-white border border-slate-100 rounded-sm shadow-lg z-50 overflow-hidden">
                            <div class="flex flex-col">
                                <button class="dropdown-item w-full text-center py-2 text-sm text-white bg-emerald-500 hover:bg-emerald-600 transition-colors" data-value="day">按天</button>
                                <button class="dropdown-item w-full text-center py-2 text-sm text-slate-600 hover:bg-slate-50 transition-colors" data-value="week">按周</button>
                                <button class="dropdown-item w-full text-center py-2 text-sm text-slate-600 hover:bg-slate-50 transition-colors" data-value="month">按月</button>
                            </div>
                        </div>
                    </div>

                    <!-- 日期范围显示框 -->
                    <div class="bg-white border border-slate-200 text-slate-500 py-1.5 px-3 rounded-sm text-sm flex items-center gap-2 shadow-sm">
                        <svg class="h-4 w-4 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
                        <span id="dateRangeText">2026-04-01 至 2026-04-05</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- ECharts 渲染容器 -->
        <div id="trendChart" class="w-full h-[550px]"></div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // 初始化 ECharts 实例
            const chartDom = document.getElementById('trendChart');
            const myChart = echarts.init(chartDom);

            // X轴：智能体名称
            const agents = ['预受理智能体', '数采智能体', '定责智能体', '剔费智能体', '理算智能体', '审核智能体'];
            
            // 背景覆盖面积：年度目标值
            const targetValues = [100, 35, 15, 45, 55, 55];

            // 准备多维度模拟数据（日、周、月）
            const mockData = {
                day: {
                    labels: ['4月1日', '4月2日', '4月3日', '4月4日', '4月5日'],
                    data: [
                        [70, 15, 3, 20, 35, 36],
                        [78, 20, 6, 28, 40, 42],
                        [85, 25, 9, 35, 46, 48],
                        [92, 30, 12, 40, 50, 52],
                        [98, 35, 15, 45, 54, 55]
                    ]
                },
                week: {
                    labels: ['第1周', '第2周', '第3周', '第4周', '第5周'],
                    data: [
                        [60, 10, 2, 15, 30, 30],
                        [70, 15, 5, 25, 35, 38],
                        [80, 22, 9, 32, 42, 45],
                        [88, 28, 12, 40, 48, 50],
                        [95, 35, 16, 46, 55, 56]
                    ]
                },
                month: {
                    labels: ['1月', '2月', '3月', '4月', '5月'],
                    data: [
                        [30, 5, 0, 10, 15, 15],
                        [50, 12, 3, 20, 25, 28],
                        [70, 20, 8, 30, 35, 40],
                        [85, 28, 12, 40, 45, 48],
                        [98, 38, 18, 48, 56, 58]
                    ]
                }
            };

            // 动态生成折线数据的函数
            const buildSeries = (periodData) => {
                const colors = ['#cbd5e1', '#94a3b8', '#fb923c', '#f43f5e', '#6366f1'];
                const widths = [2, 2, 3, 3, 3];
                const sizes = [6, 6, 8, 8, 10];
                
                const lines = periodData.labels.map((label, index) => ({
                    name: label,
                    type: 'line',
                    smooth: true,
                    data: periodData.data[index],
                    lineStyle: { width: widths[index], color: colors[index] },
                    itemStyle: index === 4 
                        ? { color: colors[index], borderWidth: 2, borderColor: '#fff' } 
                        : { color: colors[index] },
                    symbol: 'circle',
                    symbolSize: sizes[index],
                    z: index + 2
                }));

                return [
                    {
                        name: '年度目标值 (覆盖面积)',
                        type: 'line',
                        step: 'middle',
                        data: targetValues,
                        areaStyle: {
                            color: new echarts.graphic.LinearGradient(0, 0, 0, 1, [
                                { offset: 0, color: 'rgba(14, 165, 233, 0.35)' },
                                { offset: 1, color: 'rgba(14, 165, 233, 0.05)' }
                            ])
                        },
                        lineStyle: { color: '#0ea5e9', width: 2, type: 'dashed' },
                        itemStyle: { color: '#0ea5e9', opacity: 0 },
                        symbol: 'none',
                        z: 1
                    },
                    ...lines
                ];
            };

            // 动态生成完整的图表配置
            const getOption = (periodType) => {
                const currentData = mockData[periodType];
                
                return {
                    tooltip: {
                        trigger: 'axis',
                        axisPointer: { type: 'shadow', shadowStyle: { color: 'rgba(238, 242, 246, 0.4)' } },
                        valueFormatter: (value) => value + '%',
                        backgroundColor: 'rgba(255, 255, 255, 0.95)',
                        borderColor: '#e2e8f0',
                        textStyle: { color: '#334155' }
                    },
                    legend: {
                        data: [
                            { name: '年度目标值 (覆盖面积)', icon: 'rect', itemStyle: { color: '#7dd3fc', opacity: 1 } },
                            ...currentData.labels
                        ],
                        bottom: 0,
                        itemGap: 16,
                        textStyle: { color: '#475569', fontSize: 13 }
                    },
                    grid: { left: '2%', right: '4%', bottom: '12%', top: '8%', containLabel: true },
                    xAxis: {
                        type: 'category',
                        boundaryGap: true,
                        data: agents,
                        axisLabel: { interval: 0, color: '#334155', fontSize: 13, fontWeight: '600', margin: 16 },
                        axisTick: { show: false },
                        axisLine: { lineStyle: { color: '#cbd5e1' } }
                    },
                    yAxis: {
                        type: 'value',
                        name: '自动化率 (%)',
                        max: 100,
                        nameTextStyle: { color: '#64748b', fontSize: 13, padding: [0, 30, 10, 0] },
                        axisLabel: { color: '#64748b', formatter: '{value}%' },
                        splitLine: { lineStyle: { type: 'dashed', color: '#f1f5f9' } }
                    },
                    series: buildSeries(currentData)
                };
            };

            // 初始渲染图表（默认按日）
            myChart.setOption(getOption('day'));

            // 绑定自定义下拉框及日期范围联动逻辑
            const dropdownTrigger = document.getElementById('dropdownTrigger');
            const dropdownMenu = document.getElementById('dropdownMenu');
            const dropdownItems = document.querySelectorAll('.dropdown-item');
            const dropdownLabel = document.getElementById('dropdownLabel');
            const dateRangeText = document.getElementById('dateRangeText');

            // 定义不同周期对应的动态日期范围文案
            const dateRanges = {
                day: '2026-04-01 至 2026-04-05',
                week: '2026-03-02 至 2026-04-05',
                month: '2026-01-01 至 2026-05-31'
            };

            // 切换下拉菜单显示/隐藏
            dropdownTrigger.addEventListener('click', (e) => {
                e.stopPropagation(); // 阻止事件冒泡，防止触发 document 点击事件
                dropdownMenu.classList.toggle('hidden');
            });

            // 点击页面其他区域关闭下拉菜单
            document.addEventListener('click', () => {
                dropdownMenu.classList.add('hidden');
            });

            // 点击选项切换数据和样式
            dropdownItems.forEach(item => {
                item.addEventListener('click', (e) => {
                    const value = e.target.getAttribute('data-value');
                    const text = e.target.innerText;

                    // 1. 更新触发按钮的文本
                    dropdownLabel.innerText = text;

                    // 2. 更新选中项的绿色背景样式
                    dropdownItems.forEach(btn => {
                        btn.className = 'dropdown-item w-full text-center py-2 text-sm text-slate-600 hover:bg-slate-50 transition-colors';
                    });
                    e.target.className = 'dropdown-item w-full text-center py-2 text-sm text-white bg-emerald-500 hover:bg-emerald-600 transition-colors';

                    // 3. 更新联动日期范围文案
                    dateRangeText.innerText = dateRanges[value];

                    // 4. 重绘图表数据 (notMerge 设为 true)
                    myChart.setOption(getOption(value), true); 
                });
            });

            // 监听窗口大小变化以自适应调整图表
            window.addEventListener('resize', () => {
                myChart.resize();
            });
        });
    </script>
</body>
</html>
